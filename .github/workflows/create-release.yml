name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment; current releases the version already in VERSION
        required: true
        default: current
        type: choice
        options:
          - current
          - patch
          - minor
          - major
      branch:
        description: Stable releases use main; prereleases use rc
        required: true
        default: main
        type: choice
        options:
          - main
          - rc
      dry_run:
        description: Validate without committing, tagging, releasing, or publishing artifacts
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install release tooling
        run: bun install --frozen-lockfile

      - name: Check version consistency
        run: bun run check:version

      - name: Configure release Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCREMENT: ${{ inputs.increment }}
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: |
          DRY_RUN_ARGS=()
          if [[ "$DRY_RUN" == "true" ]]; then
            DRY_RUN_ARGS=(--dry-run)
          fi

          case "$RELEASE_BRANCH:$INCREMENT" in
            main:current)
              bun run release -- --ci --no-increment "${DRY_RUN_ARGS[@]}"
              ;;
            main:patch|main:minor|main:major)
              bun run release -- --ci "$INCREMENT" "${DRY_RUN_ARGS[@]}"
              ;;
            rc:current)
              bun run release -- --ci --preRelease=rc "${DRY_RUN_ARGS[@]}"
              ;;
            rc:patch|rc:minor|rc:major)
              bun run release -- --ci "$INCREMENT" --preRelease=rc "${DRY_RUN_ARGS[@]}"
              ;;
          esac

      - name: Read released version
        id: version
        shell: bash
        run: echo "tag=v$(tr -d '\n' < VERSION)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish artifacts
    if: ${{ !inputs.dry_run }}
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      prerelease: ${{ inputs.branch == 'rc' }}
