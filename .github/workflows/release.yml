name: Release artifacts

on:
  release:
    types:
      - published

concurrency:
  group: container-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GHCR image and Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE_NAME: ghcr.io/inkronik/kubernetes-agent
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.21.1

      - name: Validate release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(tr -d '\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v${version}"
          chart_metadata="$(helm show chart charts/inkronik-kubernetes-agent)"
          test "$(sed -n 's/^version: //p' <<< "$chart_metadata")" = "$version"
          test "$(sed -n 's/^appVersion: //p' <<< "$chart_metadata" | tr -d '"')" = "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest@v4.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Package Helm chart
        id: chart
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          helm lint --strict charts/inkronik-kubernetes-agent \
            --set-string clusterName=release-validation
          helm package charts/inkronik-kubernetes-agent --destination "$RUNNER_TEMP"
          chart_path="$RUNNER_TEMP/inkronik-kubernetes-agent-${VERSION}.tgz"
          test -f "$chart_path"
          echo "path=$chart_path" >> "$GITHUB_OUTPUT"

      - name: Log in Helm to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push Helm chart
        run: helm push "${{ steps.chart.outputs.path }}" oci://ghcr.io/inkronik/charts
