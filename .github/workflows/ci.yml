name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install release tooling
        run: bun install --frozen-lockfile

      - name: Check version consistency
        run: bun run check:version

      - name: Audit release tooling dependencies
        run: bun audit --audit-level=high

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\n' < VERSION)"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Scan dependencies and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build binary
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X github.com/inkronik/kubernetes-agent/internal/version.Value=${VERSION}" \
            -o /tmp/inkronik-k8s-agent ./cmd/inkronik-k8s-agent

      - name: Validate Helm chart versions
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          chart_metadata="$(helm show chart charts/inkronik-kubernetes-agent)"
          test "$(sed -n 's/^version: //p' <<< "$chart_metadata")" = "$VERSION"
          test "$(sed -n 's/^appVersion: //p' <<< "$chart_metadata" | tr -d '"')" = "$VERSION"

      - name: Lint Helm chart
        run: |
          helm lint --strict charts/inkronik-kubernetes-agent \
            --set-string clusterName=ci-cluster

      - name: Render and inspect Helm chart
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          helm template inkronik-kubernetes-agent charts/inkronik-kubernetes-agent \
            --namespace inkronik \
            --set-string clusterName=ci-cluster \
            > "$RUNNER_TEMP/chart-default.yaml"

          helm template custom charts/inkronik-kubernetes-agent \
            --namespace observability \
            --set-string clusterName=staging-eu \
            --set serviceAccount.create=false \
            --set-string serviceAccount.name=platform-agent \
            --set rbac.create=false \
            --set 'namespaces={payments,orders}' \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > "$RUNNER_TEMP/chart-custom.yaml"

          helm template no-kubelet-stats charts/inkronik-kubernetes-agent \
            --namespace inkronik \
            --set-string clusterName=ci-cluster \
            --set kubeletStats.enabled=false \
            > "$RUNNER_TEMP/chart-no-kubelet-stats.yaml"

          helm template secrets-store-csi charts/inkronik-kubernetes-agent \
            --namespace inkronik \
            --set-string clusterName=ci-cluster \
            --set-string ingestSecret.name=vault-development \
            --set secretsStoreCsi.enabled=true \
            --set-string secretsStoreCsi.secretProviderClassName=vault-development \
            > "$RUNNER_TEMP/chart-secrets-store-csi.yaml"

          grep -Fq "image: \"ghcr.io/inkronik/kubernetes-agent:${VERSION}\"" "$RUNNER_TEMP/chart-default.yaml"
          grep -Fq 'value: "https://collector.inkronik.codemask.dev"' "$RUNNER_TEMP/chart-default.yaml"
          grep -Fq 'runAsNonRoot: true' "$RUNNER_TEMP/chart-default.yaml"
          grep -Fq 'readOnlyRootFilesystem: true' "$RUNNER_TEMP/chart-default.yaml"
          grep -Fq 'secretKeyRef:' "$RUNNER_TEMP/chart-default.yaml"
          grep -Fq 'name: INKRONIK_KUBELET_STATS_ENABLED' "$RUNNER_TEMP/chart-default.yaml"
          grep -Fq 'value: "true"' "$RUNNER_TEMP/chart-default.yaml"
          grep -Fq 'value: "payments,orders"' "$RUNNER_TEMP/chart-custom.yaml"
          grep -Fq 'serviceAccountName: platform-agent' "$RUNNER_TEMP/chart-custom.yaml"
          grep -Fq 'image: "ghcr.io/inkronik/kubernetes-agent@sha256:aaaaaaaa' "$RUNNER_TEMP/chart-custom.yaml"
          grep -Fq 'driver: secrets-store.csi.k8s.io' "$RUNNER_TEMP/chart-secrets-store-csi.yaml"
          grep -Fq 'secretProviderClass: "vault-development"' "$RUNNER_TEMP/chart-secrets-store-csi.yaml"
          grep -Fq 'mountPath: "/mnt/secrets-store"' "$RUNNER_TEMP/chart-secrets-store-csi.yaml"

          if helm template invalid-csi charts/inkronik-kubernetes-agent \
            --set-string clusterName=ci-cluster \
            --set secretsStoreCsi.enabled=true >/dev/null 2>&1; then
            echo "Secrets Store CSI rendered without a SecretProviderClass name" >&2
            exit 1
          fi

          if grep -Eq '^kind: Secret$|verbs:.*(create|update|patch|delete)' "$RUNNER_TEMP/chart-default.yaml"; then
            echo "Rendered chart contains a Secret or write-capable RBAC" >&2
            exit 1
          fi

          grep -Fq 'nodes/proxy' "$RUNNER_TEMP/chart-default.yaml"

          if grep -Fq 'nodes/proxy' "$RUNNER_TEMP/chart-no-kubelet-stats.yaml"; then
            echo "Reduced-permission chart rendered kubelet proxy access" >&2
            exit 1
          fi

          if grep -Eq '^kind: (ClusterRole|ClusterRoleBinding|ServiceAccount)$' "$RUNNER_TEMP/chart-custom.yaml"; then
            echo "Externally managed RBAC profile rendered an owned access resource" >&2
            exit 1
          fi

      - name: Scan rendered Kubernetes manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ runner.temp }}/chart-default.yaml
          trivyignores: .trivyignore
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Package Helm chart
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          helm package charts/inkronik-kubernetes-agent --destination "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/inkronik-kubernetes-agent-${VERSION}.tgz"
          helm show chart "$RUNNER_TEMP/inkronik-kubernetes-agent-${VERSION}.tgz"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build container image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
