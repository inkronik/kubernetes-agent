name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.21.1

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build binary
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X github.com/inkronik/kubernetes-agent/internal/version.Value=${VERSION}" \
            -o /tmp/inkronik-k8s-agent ./cmd/inkronik-k8s-agent

      - name: Validate Helm chart versions
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          chart_metadata="$(helm show chart charts/inkronik-kubernetes-agent)"
          test "$(sed -n 's/^version: //p' <<< "$chart_metadata")" = "$VERSION"
          test "$(sed -n 's/^appVersion: //p' <<< "$chart_metadata" | tr -d '"')" = "$VERSION"

      - name: Lint Helm chart
        run: |
          helm lint --strict charts/inkronik-kubernetes-agent \
            --set-string clusterName=ci-cluster

      - name: Render and inspect Helm chart
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          helm template inkronik-kubernetes-agent charts/inkronik-kubernetes-agent \
            --namespace inkronik \
            --set-string clusterName=ci-cluster \
            > "$RUNNER_TEMP/chart-default.yaml"

          helm template custom charts/inkronik-kubernetes-agent \
            --namespace observability \
            --set-string clusterName=staging-eu \
            --set serviceAccount.create=false \
            --set-string serviceAccount.name=platform-agent \
            --set rbac.create=false \
            --set 'namespaces={payments,orders}' \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > "$RUNNER_TEMP/chart-custom.yaml"

          grep -Fq "image: \"ghcr.io/inkronik/kubernetes-agent:${VERSION}\"" "$RUNNER_TEMP/chart-default.yaml"
          grep -Fq 'value: "https://collector.inkronik.codemask.dev"' "$RUNNER_TEMP/chart-default.yaml"
          grep -Fq 'runAsNonRoot: true' "$RUNNER_TEMP/chart-default.yaml"
          grep -Fq 'readOnlyRootFilesystem: true' "$RUNNER_TEMP/chart-default.yaml"
          grep -Fq 'secretKeyRef:' "$RUNNER_TEMP/chart-default.yaml"
          grep -Fq 'value: "payments,orders"' "$RUNNER_TEMP/chart-custom.yaml"
          grep -Fq 'serviceAccountName: platform-agent' "$RUNNER_TEMP/chart-custom.yaml"
          grep -Fq 'image: "ghcr.io/inkronik/kubernetes-agent@sha256:aaaaaaaa' "$RUNNER_TEMP/chart-custom.yaml"

          if grep -Eq '^kind: Secret$|verbs:.*(create|update|patch|delete)' "$RUNNER_TEMP/chart-default.yaml"; then
            echo "Rendered chart contains a Secret or write-capable RBAC" >&2
            exit 1
          fi

          if grep -Eq '^kind: (ClusterRole|ClusterRoleBinding|ServiceAccount)$' "$RUNNER_TEMP/chart-custom.yaml"; then
            echo "Externally managed RBAC profile rendered an owned access resource" >&2
            exit 1
          fi

      - name: Package Helm chart
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          helm package charts/inkronik-kubernetes-agent --destination "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/inkronik-kubernetes-agent-${VERSION}.tgz"
          helm show chart "$RUNNER_TEMP/inkronik-kubernetes-agent-${VERSION}.tgz"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build container image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
