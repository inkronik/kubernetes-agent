apiVersion: v1
kind: Namespace
metadata:
  name: inkronik
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inkronik-k8s-agent
  namespace: inkronik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inkronik-k8s-agent
rules:
  - apiGroups: ['']
    resources: ['events', 'nodes', 'pods']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['nodes/proxy']
    verbs: ['get']
  - apiGroups: ['apps']
    resources: ['deployments', 'replicasets']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['autoscaling']
    resources: ['horizontalpodautoscalers']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['metrics.k8s.io']
    resources: ['nodes', 'pods']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inkronik-k8s-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inkronik-k8s-agent
subjects:
  - kind: ServiceAccount
    name: inkronik-k8s-agent
    namespace: inkronik
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inkronik-k8s-agent
  namespace: inkronik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inkronik-k8s-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inkronik-k8s-agent
    spec:
      serviceAccountName: inkronik-k8s-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/inkronik/kubernetes-agent:1.1.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: INKRONIK_COLLECTOR_URL
              value: https://collector.inkronik.codemask.dev
            - name: INKRONIK_CLUSTER_NAME
              value: replace-with-cluster-name
            - name: INKRONIK_ENVIRONMENT
              value: prod
            - name: INKRONIK_KUBELET_STATS_ENABLED
              value: 'true'
            - name: INKRONIK_HEALTH_ADDR
              value: :8080
            - name: INKRONIK_INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inkronik-k8s-agent
                  key: INKRONIK_INGEST_API_KEY
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
